<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Samán Deportivo: plataforma de gestión de clubes deportivos de la UNIMET.">
  <meta name="theme-color" content="#F58220">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Samán Deportivo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Samán Deportivo</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #F58220; }
    #carga {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      background: linear-gradient(160deg, #F58220 0%, #C2410C 100%);
      color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    #carga.oculta { opacity: 0; pointer-events: none; }
    #carga img { width: 112px; height: 112px; border-radius: 26px; background: #fff; box-shadow: 0 12px 32px rgba(0, 0, 0, .22); }
    #carga strong { font-size: 22px; font-weight: 700; letter-spacing: .2px; }
    #carga .barra { width: 160px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .3); overflow: hidden; }
    #carga .barra::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 4px; background: #fff;
      animation: avance 1.1s ease-in-out infinite;
    }
    @keyframes avance { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #carga .barra::after { animation: none; width: 100%; opacity: .7; }
      #carga { transition: none; }
    }
  </style>
</head>
<body>
  <!-- Se ve mientras baja la aplicación y se quita con el primer cuadro de Flutter. -->
  <div id="carga" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <strong>Samán Deportivo</strong>
    <div class="barra" aria-hidden="true"></div>
    <span style="position:absolute;left:-9999px">Cargando…</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var carga = document.getElementById('carga');
      if (!carga) return;
      carga.classList.add('oculta');
      setTimeout(function () { carga.remove(); document.body.style.background = ''; }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
